name: RIFF browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Run browser tests
        run: npm test
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  live-browser-tests:
    needs: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Wait for GitHub Pages deployment
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://nikofunk.github.io/Riff/ -o /tmp/riff-live.html && grep -q 'RIFF' /tmp/riff-live.html; then
              echo "GitHub Pages site responds with RIFF content."
              exit 0
            fi
            echo "Waiting for GitHub Pages deploy... attempt $attempt"
            sleep 10
          done
          echo "GitHub Pages site did not become ready in time."
          exit 1
      - name: Run browser tests against production
        env:
          RIFF_URL: https://nikofunk.github.io/Riff/
        run: npm test
      - name: Upload live test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: riff-live-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
